[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frugal"
version = "0.1.0"
description = "A cost-aware search planner for SerpApi: compile a question into an optimal search plan under an explicit budget."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Desilva S", email = "desilvas2002@gmail.com" }]
requires-python = ">=3.11"
keywords = ["serpapi", "search", "agents", "retrieval", "query-planning"]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
# The MCP SDK is an integration, not a core component: someone using the library
# should not have to install a protocol they are not speaking.
mcp = [
    "mcp>=2.0",
]
langchain = [
    "langchain-core>=1.0",
]
llamaindex = [
    "llama-index-core>=0.12",
]
dev = [
    "mcp>=2.0",
    "langchain-core>=1.0",
    "llama-index-core>=0.12",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
frugal = "frugal.cli:main"
frugal-mcp = "frugal.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frugal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The real floor. mypy checks against a later grammar for the reason given above,
# so this is what stops 3.12-only syntax reaching code that must run on 3.11.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Checked against 3.12's grammar, not the 3.11 floor this project supports.
# llama-index pulls in numpy, whose stubs use 3.12-only syntax, and mypy parses
# every installed package it can see -- so a 3.11 setting failed the build over a
# dependency's stub without a line of our code changing. Excluding site-packages
# instead was worse: it untyped the SDKs we do use.
#
# The floor is still enforced. ruff's target-version below is py311, so 3.12-only
# syntax in our own code is rejected there, and CI runs the suite on 3.11.
python_version = "3.12"
strict = true
files = ["src/frugal"]

